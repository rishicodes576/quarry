name: Security and integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Start isolated local services
        run: python3 scripts/manage.py up
      - name: Verify behavior and browser workflows
        run: python3 scripts/manage.py verify
      - name: Free security scans
        if: always()
        run: python3 scripts/security_scan.py --dynamic --images
      - name: Stop services
        if: always()
        run: docker compose down
