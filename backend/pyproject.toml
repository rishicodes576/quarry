[project]
name = "quarry-research"
version = "0.1.0"
description = "Inspectable, recoverable engineering research with measured hybrid retrieval"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.38,<2.1",
  "psycopg[binary,pool]>=3.2,<4", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "pypdf>=5.3,<7", "beautifulsoup4>=4.13,<5",
  "qdrant-client>=1.14,<2", "onnxruntime>=1.23,<2", "tokenizers>=0.22,<1",
  "numpy>=2,<3", "mmh3>=5,<6", "py-rust-stemmers>=0.1,<1", "huggingface-hub>=0.35,<3",
  "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4",
  "prometheus-client>=0.21,<1", "boto3>=1.37,<2",
  "alembic>=1.14,<2", "argon2-cffi>=25.1,<26", "email-validator>=2.2,<3",
  "cryptography>=50,<51", "pyotp>=2.9,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]
eval = ["ragas==0.4.3", "langchain-community==0.3.31", "openai>=1.99,<3", "pillow>=13,<14"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["quarry*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
cache_dir = "/tmp/quarry-pytest"
markers = ["integration: requires PostgreSQL and Qdrant", "models: downloads and runs real ONNX models"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "B008", "E501"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S104"]
